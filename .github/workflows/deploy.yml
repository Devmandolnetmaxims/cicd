name: 🚀 Deploy Laravel App via SFTP

on:
  push:
    branches:
      - dev   # change this to dev, staging, or prod as needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./
          remote_path: public_html/mindovermatter.appswatt.com/
          sftp_only: true

      - name: Run Laravel commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          script: |
            cd /home2/netma2bd/public_html/mindovermatter.appswatt.com
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
