name: 🚀 Deploy Laravel App via FTP

on:
  push:
    branches:
      - dev   # change to dev, staging, or prod as needed

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload files to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./       # local repo path
          server-dir: /home2/netma2db/public_html/mindovermatter.appswatt.com   # remote path on server
