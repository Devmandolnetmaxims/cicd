name: 🚀 Deploy Laravel App via SFTP

on:
  push:
    branches:
      - dev   # change this to dev, staging, or prod as needed

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}          # your SFTP server
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./                             # local repo root
          remote_path: /public_html/mindovermatter.appswatt.com/
          sftp_only: true
